<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdfdfc">
<title>kayhs · 个人工具站</title>
<meta name="description" content="kayhs 的个人工具站：云盘、开发工具、书签导航、短链接、代码片段与博客。">
<meta name="color-scheme" content="light dark">

<!-- PWA：离线可用，装到桌面 -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="/" crossorigin>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">

<!-- RSS：博客有真源，不是摆设 -->
<link rel="alternate" type="application/rss+xml" title="kayhs 博客" href="/feed.xml">

<script>
  /* 主题要在首屏渲染前定下来，否则会闪一下白 */
  (function () {
    try {
      var t = localStorage.getItem('kayhs.theme');
      if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.content = t === 'dark' ? '#16171a' : '#fdfdfc';
    } catch (e) {}
  })();
</script>
</head>
<body>

<div class="shell">
  <!-- ===== 侧栏 ===== -->
  <aside class="sidebar" id="sidebar" aria-label="主导航">
    <a class="brand" href="#/" id="brandLink">
      <span class="brand-mark" aria-hidden="true">k</span>
      <span>
        <span class="brand-name">kayhs</span>
        <span class="brand-sub" id="brandSub">个人工具站</span>
      </span>
    </a>

    <nav class="nav" id="nav" aria-label="页面导航"><!-- app.js 渲染 --></nav>

    <div class="sidebar-foot">
      <button class="icon-btn" id="themeToggle" type="button" title="切换主题"></button>
      <a class="icon-btn" id="ghLink" href="https://github.com/keyh4" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"></a>
      <button class="icon-btn" id="authToggle" type="button" title="登录"></button>
    </div>
  </aside>

  <!-- ===== 主区 ===== -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menuToggle" type="button" aria-label="打开导航" aria-expanded="false"></button>
      <div class="topbar-title" id="topbarTitle">
        <span id="pageTitle">首页</span>
        <span class="topbar-crumb" id="pageCrumb"></span>
      </div>
      <div class="topbar-spacer"></div>
      <button class="search-trigger" id="searchTrigger" type="button" aria-label="搜索">
        <span class="search-icon"></span>
        <span>搜索工具与页面</span>
        <kbd>⌘K</kbd>
      </button>
      <span class="conn" id="connState" title="后端连接状态"><span class="conn-dot"></span><span class="conn-text">检测中</span></span>
    </header>

    <main class="content" id="content" role="main"><!-- 视图挂载点 --></main>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toast-host" id="toastHost" aria-live="polite" aria-atomic="false"></div>

<!--
  第三方库一律自托管在 /vendor/ 下，按需加载（见 core.js 的 ensureLib）。
  原因：外部 CDN（含 jsDelivr）在中国大陆间歇性不可用，而站点主要面向国内访问。
  旧版把字体挂在 miaoda.feishu.cn，同样属于不可控的第三方依赖。
-->
<script src="/js/core.js" defer></script>
<script src="/js/app.js" defer></script>
<script src="/js/views/home.js" defer></script>
<script src="/js/views/drive.js" defer></script>
<script src="/js/views/tools.js" defer></script>
<script src="/js/views/collections.js" defer></script>
<script src="/js/views/blog.js" defer></script>
<script src="/js/views/settings.js" defer></script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/sw.js').catch(function () { /* 注册失败不影响使用 */ });
    });
  }
</script>
</body>
</html>
